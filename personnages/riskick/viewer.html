<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riskick — personnage 3D</title>
<style>
body{margin:0;background:#f7eddf;color:#233149;font:16px system-ui;overflow:hidden}
canvas{display:block;width:100%;height:100vh}
header{position:absolute;top:24px;left:28px;pointer-events:none}
header a{pointer-events:auto;display:inline-block;margin-top:6px;font-size:14px;padding:6px 14px;background:#ffffffcc;color:#233149;border:1px solid #23314933}
h1{margin:0;font-size:38px;letter-spacing:.02em}
p{margin:6px 0}
footer{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px}
button,a{border:0;border-radius:24px;background:#233149;color:white;padding:12px 20px;font:inherit;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
button:active{transform:scale(.97)}
button[aria-pressed=true]{background:#c74a17}
button.secondary{background:#475569}
button.secondary[aria-pressed=true]{background:#0f766e}
#status{position:absolute;top:110px;left:28px}
</style>
<script type="importmap">{"imports":{"three":"./models/personnages/riskick/viewer/three.module.js","three/addons/":"./models/personnages/riskick/viewer/"}}</script></head>
<body><header><h1>RISKICK</h1><p>Le danger prend vie · Personnage 1 (Méchant)</p><p>Glissez pour tourner · Molette pour zoomer · Cliquez au sol en mode Marche</p><a href="./preventeur-guy.html">Voir Personnage 2 : Le Préventeur Guy →</a></header><div id="status">Chargement…</div><footer><button data-clip="Idle" aria-pressed="false">Au repos</button><button data-clip="Taunt" aria-pressed="false">Provocation</button><button data-clip="Walk" aria-pressed="true">Marche</button><button id="roamBtn" class="secondary" aria-pressed="true">Déplacement : En ronde</button><a href="./models/personnages/riskick/riskick-v1.glb" download>Télécharger le modèle 3D</a></footer>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#f7eddf');
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(3,2.2,5.2);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.05,0);controls.minDistance=2.5;controls.maxDistance=9;controls.maxPolarAngle=Math.PI/2;controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xffffff,0x957f68,2.5));
const key=new T.DirectionalLight(0xffefd8,4);key.position.set(-3,5,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const rim=new T.DirectionalLight(0xc6deff,2);rim.position.set(3,3,-3);scene.add(rim);
const floor=new T.Mesh(new T.CircleGeometry(3.2,64),new T.MeshStandardMaterial({color:'#eadbc6',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=.02;floor.receiveShadow=true;scene.add(floor);
const ring=new T.Mesh(new T.RingGeometry(1.32,1.38,64),new T.MeshBasicMaterial({color:'#d9c7ad',side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.025;scene.add(ring);
const targetMarker=new T.Mesh(new T.RingGeometry(.12,.18,32),new T.MeshBasicMaterial({color:'#c74a17',side:T.DoubleSide}));targetMarker.rotation.x=-Math.PI/2;targetMarker.position.y=.03;targetMarker.visible=false;scene.add(targetMarker);

let mixer,currentAction,clips=[],actor,currentClip='Walk',roaming=true,roamAngle=0,walkTarget=null;
function playClip(name){
  if(!mixer)return;
  const clip=clips.find(c=>c.name===name);
  if(!clip)return;
  const next=mixer.clipAction(clip);
  if(currentAction&&currentAction!==next){
    next.reset().play();
    currentAction.crossFadeTo(next,.22,true);
  }else{
    next.reset().play();
  }
  currentAction=next;
  currentClip=name;
  if(name!=='Walk'&&actor){
    walkTarget=null;
    targetMarker.visible=false;
  }
  document.querySelectorAll('button[data-clip]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.clip===name)));
}

new GLTFLoader().load('./models/personnages/riskick/riskick-v1.glb',g=>{
  actor=g.scene;
  scene.add(actor);
  actor.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  mixer=new T.AnimationMixer(actor);
  clips=g.animations;
  playClip('Walk');
  document.querySelector('#status')?.remove();
},undefined,()=>{document.querySelector('#status').textContent='Le modèle ne peut pas être chargé.';});

document.querySelectorAll('button[data-clip]').forEach(b=>b.onclick=()=>playClip(b.dataset.clip));
const roamBtn=document.querySelector('#roamBtn');
roamBtn.onclick=()=>{
  roaming=!roaming;
  walkTarget=null;
  targetMarker.visible=false;
  roamBtn.setAttribute('aria-pressed',String(roaming));
  roamBtn.textContent=roaming?'Déplacement : En ronde':'Déplacement : Sur place';
  if(!roaming&&actor){actor.position.set(0,0,0);actor.rotation.set(0,0,0);}
};

const raycaster=new T.Raycaster(),pointer=new T.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>{downPos=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos||Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>6||!actor)return;
  pointer.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObject(floor)[0];
  if(hit&&hit.point.length()<2.7){
    walkTarget=new T.Vector3(hit.point.x,0,hit.point.z);
    targetMarker.position.set(hit.point.x,.03,hit.point.z);
    targetMarker.visible=true;
    if(currentClip!=='Walk')playClip('Walk');
  }
});

const clock=new T.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  mixer?.update(dt);
  if(actor&&currentClip==='Walk'){
    if(walkTarget){
      const dx=walkTarget.x-actor.position.x,dz=walkTarget.z-actor.position.z;
      const dist=Math.hypot(dx,dz);
      if(dist<.08){
        walkTarget=null;
        targetMarker.visible=false;
        if(!roaming)playClip('Idle');
      }else{
        const speed=1.15;
        actor.position.x+=(dx/dist)*Math.min(dist,speed*dt);
        actor.position.z+=(dz/dist)*Math.min(dist,speed*dt);
        const targetYaw=Math.atan2(dx,dz);
        let diff=targetYaw-actor.rotation.y;
        diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        actor.rotation.y+=diff*Math.min(1,dt*10);
      }
    }else if(roaming){
      roamAngle+=dt*.85;
      const r=1.35;
      const nx=Math.cos(roamAngle)*r,nz=Math.sin(roamAngle)*r;
      const vx=-Math.sin(roamAngle),vz=Math.cos(roamAngle);
      actor.position.set(nx,0,nz);
      actor.rotation.y=Math.atan2(vx,vz);
    }else{
      actor.position.lerp(new T.Vector3(0,0,0),Math.min(1,dt*8));
      actor.rotation.y*=Math.max(0,1-dt*6);
    }
  }
  controls.update();
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
